<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Base DeFi</title>
</head>
  <body>
    <div id="app">
      <h1>Base DeFi Dashboard 🔵</h1>
      <p>จำลองการ Stake บนเครือข่าย Base</p>
      <button id="connectBtn">Connect Wallet</button>
      <hr>
      <div class="card" id="faucetCard">
        <h2>1. Base Faucet</h2>
        <p>กดรับ 100 $BASE ฟรีสำหรับการทดสอบ</p>
        <button id="faucetBtn">Get 100 $BASE</button>
        <p>Balance: <span id="balance">0</span> $BASE</p>
        </div>
        <div class="card" id="stakeCard">
          <h2>2. Stake $BASE</h2>
          <input type="number" id="amount" placeholder="จำนวนที่ Stake">
          <button id="stakeBtn">Stake</button>
          <button id="unstakeBtn">Unstake All</button>
        </div>
    </div>
</body>
</html>
